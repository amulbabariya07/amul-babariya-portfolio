                <!-- Heading Starts -->
                <div class="text-center mb-5 mt-5">
                    <h2 class="display-3 fw-bold text-uppercase">
                        get <span class="text-primary">in touch</span>
                    </h2>
                </div>
                <!-- Heading Ends -->
                <div class="container">
                    <!-- Contact Boxes Starts -->
                    <div class="row g-4 mb-5">
                        <div class="col-12 col-md-4">
                            <div class="p-4 rounded-4 shadow-sm border border-light border-opacity-10 bg-white bg-opacity-5 text-center">
                                <span class="material-icons text-primary display-6 mb-3">call</span>
                                <h5 class="fw-bold mb-0">+91 8320269460</h5>
                            </div>
                        </div>
                        <div class="col-12 col-md-4">
                            <div class="p-4 rounded-4 shadow-sm border border-light border-opacity-10 bg-white bg-opacity-5 text-center">
                                <span class="material-icons text-primary display-6 mb-3">email</span>
                                <h5 class="fw-bold mb-0">amulbabariya07@gmail.com</h5>
                            </div>
                        </div>
                        <div class="col-12 col-md-4">
                            <div class="p-4 rounded-4 shadow-sm border border-light border-opacity-10 bg-white bg-opacity-5 text-center">
                                <span class="material-icons text-primary display-6 mb-3">location_on</span>
                                <h5 class="fw-bold mb-0">Junagadh, India 362610</h5>
                            </div>
                        </div>
                    </div>
                    <!-- Contact Boxes Ends -->
                    <div class="separator"></div>
                    <!-- Contact Form Starts -->
                    <div class="row g-5">
                        <div class="col-12 col-lg-4">
                            <div class="mb-5">
                                <h4 class="text-uppercase fw-bold mb-3">Send me an email</h4>
                                <p class="lead small">
                                    Feel free to get in touch with me. I am always open to discussing new projects or
                                    creative ideas.
                                </p>
                            </div>
                            <div>
                                <h4 class="text-uppercase fw-bold mb-3">Follow me</h4>
                                <!-- Social Media Starts -->
                                <ul class="list-unstyled d-flex gap-3 p-0">
                                    <li><a title="Facebook" href="#" class="btn btn-outline-light rounded-3 p-2 d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;"><i class="fa fa-facebook"></i></a></li>
                                    <li><a title="Twitter" href="#" class="btn btn-outline-light rounded-3 p-2 d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;"><i class="fa fa-twitter"></i></a></li>
                                    <li><a title="Linkedin" href="#" class="btn btn-outline-light rounded-3 p-2 d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;"><i class="fa fa-linkedin"></i></a></li>
                                    <li><a title="Behance" href="#" class="btn btn-outline-light rounded-3 p-2 d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;"><i class="fa fa-behance"></i></a></li>
                                </ul>
                                <!-- Social Media Ends -->
                            </div>
                        </div>
                        <div class="col-12 col-lg-8">
                            <form class="formcontact" method="post" action="#">
                                <div class="row contactform">
                                    <div class="col-12 col-md-6 mb-4">
                                        <input type="text" id="contact-name" name="name" class="form-control bg-white bg-opacity-5 border-light border-opacity-10 text-white rounded-3 p-3" placeholder="YOUR NAME" autocomplete="off" required>
                                    </div>
                                    <div class="col-12 col-md-6 mb-4">
                                        <input type="email" id="contact-email" name="email" class="form-control bg-white bg-opacity-5 border-light border-opacity-10 text-white rounded-3 p-3" placeholder="YOUR EMAIL" autocomplete="off">
                                    </div>
                                    <div class="col-12 col-md-6 mb-4">
                                        <input type="text" id="contact-phone" name="phone" class="form-control bg-white bg-opacity-5 border-light border-opacity-10 text-white rounded-3 p-3" placeholder="YOUR MOBILE" autocomplete="off">
                                    </div>
                                    <div class="col-12 col-md-6 mb-4">
                                        <input type="text" id="contact-subject" name="subject" class="form-control bg-white bg-opacity-5 border-light border-opacity-10 text-white rounded-3 p-3" placeholder="SUBJECT" autocomplete="off">
                                    </div>
                                    <div class="col-12 mb-4">
                                        <textarea name="message" class="form-control bg-white bg-opacity-5 border-light border-opacity-10 text-white rounded-3 p-3" rows="5" placeholder="YOUR MESSAGE"></textarea>
                                    </div>
                                    <div class="col-12">
                                        <button type="submit" class="btn btn-primary px-5 py-3 rounded-3 shadow fw-bold text-uppercase"><span>Send Message</span></button>
                                    </div>
                                    <div class="col-12 form-message d-none">
                                        <span class="output_message text-center text-uppercase"></span>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Contact Boxes Ends -->
                </div>
            </div>

                                class="text-primary fw-bold small text-uppercase letter-spacing-1 mb-4"></p>

                    <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3"

                    <img id="preview-img-full" src="" class="img-fluid rounded-3 shadow-lg" style="max-height: 90vh;">
                </div>
